services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: webhook_test
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: webhook
      RABBITMQ_DEFAULT_PASS: webhook
      RABBITMQ_DEFAULT_VHOST: webhook
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  rabbitmq_data:
