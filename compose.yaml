services:
  migrate:
    build: .
    image: webhook-service:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://webhook:webhook@postgres:5432/webhook
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: webhook-service:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://webhook:webhook@postgres:5432/webhook
      BROKER_URL: amqp://webhook:webhook@rabbitmq:5672/webhook
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dispatcher:
    build: .
    image: webhook-service:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://webhook:webhook@postgres:5432/webhook
      BROKER_URL: amqp://webhook:webhook@rabbitmq:5672/webhook
    command: ["python", "-m", "app.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: .
    image: webhook-service:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://webhook:webhook@postgres:5432/webhook
      BROKER_URL: amqp://webhook:webhook@rabbitmq:5672/webhook
    command:
      ["celery", "-A", "app.tasks:celery_app", "worker", "--concurrency=2", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: webhook_test
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: webhook
      RABBITMQ_DEFAULT_PASS: webhook
      RABBITMQ_DEFAULT_VHOST: webhook
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq-test:
    image: rabbitmq:4.4-alpine
    profiles: [test]
    hostname: rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: webhook
      RABBITMQ_DEFAULT_PASS: webhook
      RABBITMQ_DEFAULT_VHOST: webhook_test
    ports:
      - "127.0.0.1:5673:5672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  rabbitmq_data:
