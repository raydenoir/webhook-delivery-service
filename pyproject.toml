[project]
name = "webhook-service"
version = "0.1.0"
description = "Service for delivering events to HTTP subscribers"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116.1,<1.0",
    "uvicorn>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.9,<1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
