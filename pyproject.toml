[project]
name = "webhook-service"
version = "0.1.0"
description = "Service for delivering events to HTTP subscribers"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2.0",
    "celery>=5.6,<6",
    "fastapi>=0.116.1,<1.0",
    "httpx2>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "ruff>=0.12.9,<1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: проверки с настоящими Celery и RabbitMQ"]
